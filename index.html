<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login System</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
      font-family:Arial,sans-serif;
    }

    .container{
      background:#fff;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
      width:320px;
    }

    input{
      width:90%;
      padding:10px;
      margin:5px 0;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      padding:10px 15px;
      margin:5px;
      cursor:pointer;
    }

    #user{
      font-size:16px;
      margin-top:15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Login System 🔐</h1>

    <input id="email" type="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br><br>

    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>

    <h2 id="user"></h2>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
