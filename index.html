<!DOCTYPE html>
<html>
<head>
<title>RabbitHill Login</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  font-family:Arial,sans-serif;
}

.container{
  width:350px;
  background:#fff;
  padding:30px;
  border-radius:15px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  background:#000;
  color:#fff;
  cursor:pointer;
}

h1{
  margin-bottom:5px;
}

p{
  color:gray;
}
</style>
</head>

<body>

<div class="container">
  <h1>RabbitHill</h1>
  <p>Premium Fashion</p>

  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="signup()">Create Account</button>
  <button onclick="logout()">Logout</button>

  <h3 id="user"></h3>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
